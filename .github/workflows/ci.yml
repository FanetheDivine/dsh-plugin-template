name: CI

on:
  pull_request:
  push:
    tags:
      - '*'

jobs:
  check:
    name: Check (typecheck + lint + test:code + build + test:dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Full check
        run: pnpm run full-check

  # 模板阶段禁用发布：模板本身不是可用插件。
  # 模板转化时解禁，步骤见 docs/template-conversion.md：
  # 清空 package.json 的 version -> 恢复下面注释的 if、删掉 if: false
  # -> 提醒用户把 npm Trusted Publisher 绑定到新仓库与 .github/workflows/ci.yml。
  publish:
    name: Publish to npm (trusted publishing)
    needs: check
    # if: startsWith(github.ref, 'refs/tags/')
    if: false
    permissions:
      id-token: write   # npm OIDC 换取发布令牌 / 生成 provenance
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # trusted publishing（OIDC）要求 npm >= 11.5.1；Node 24 自带的 npm 已满足，工作流不单独安装 npm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to npm
        run: npm publish
